# Deploy backend (API) to VPS via ghcr.io + SSH
#
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#   VPS_HOST      — IP da VPS (ex: 2.24.80.138)
#   VPS_USER      — usuário SSH (ex: root)
#   VPS_SSH_KEY   — chave SSH privada (conteúdo do ~/.ssh/id_rsa ou similar)
#   GHCR_TOKEN    — GitHub PAT com scope "read:packages" (para pull na VPS)
#                   Gerar em: github.com/settings/tokens → Classic → read:packages
#
# Setup inicial na VPS (fazer uma vez):
#   git clone https://github.com/Sindicato-Rural-Patronal/back-sidicato-rural-tr.git /opt/sindicato-api
#   cp /opt/sindicato-api/.env.production.example /opt/sindicato-api/.env.production
#   nano /opt/sindicato-api/.env.production   # preencher DATABASE_URL, JWT_SECRET,
#                                             # CORS_ORIGIN, SUPABASE_*, DOMAIN
#
# As migrations rodam sozinhas no start do container (prisma migrate deploy).

name: Deploy Backend

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sindicato-rural-patronal/back-sidicato-rural-tr

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e

            # Atualiza arquivos de configuração do repo
            cd /opt/sindicato-api
            git pull origin main

            # Login no ghcr.io para pull da imagem
            echo "$GHCR_TOKEN" | docker login ghcr.io -u sindicato-rural-patronal --password-stdin

            # Pull da nova imagem e restart (migrations rodam no entrypoint)
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Remove imagens antigas
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

name: CI

# `staging` e nao `dev`: a `dev` ficou parada (a distribuicao virou
# staging = testes, main = producao) e o CI nao rodava justamente no branch
# que recebe todo o trabalho.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sind
          POSTGRES_PASSWORD: sind
          POSTGRES_DB: sindicato_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      # O schema.prisma tem de descrever o banco que as migrations criam. Aplica
      # todas elas num banco vazio e compara o resultado com o schema: qualquer
      # diferença reprova, e o SQL impresso é o que falta para os dois baterem.
      # Sem isto, divergência só aparece quando algum teste passa pelo campo: em
      # 29/09 o schema perdeu as colunas de soft-delete do Company e o que se viu
      # foram 20 E2E com 500, sem apontar a causa. A comparação não enxerga o
      # que o schema não expressa (índice parcial, trigger, CHECK), por isso
      # essas coisas não acusam diferença.
      - name: Schema × migrations
        env:
          DATABASE_URL: postgresql://sind:sind@localhost:5432/sindicato_e2e
        run: |
          npx prisma migrate deploy
          set +e
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script --exit-code
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::error title=Schema × migrations::O schema.prisma não bate com o banco criado pelas migrations. O SQL acima leva o banco ao schema: ou falta uma migration, ou o schema está errado."
          fi
          exit $code

      # Aplica todas as migrations num Postgres descartável e roda a API de
      # verdade (rotas, validação, permissões) contra ele.
      - name: E2E tests
        env:
          DATABASE_TEST_URL: postgresql://sind:sind@localhost:5432/sindicato_e2e
        run: npm run test:e2e
